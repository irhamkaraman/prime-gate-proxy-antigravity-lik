<svg width="100%" height="auto" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="center-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.85" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <radialGradient id="glow-openai" cx="20%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-anthropic" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-center" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Borders -->
    <linearGradient id="border-openai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="border-anthropic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="border-prime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Flow Connection Gradients -->
    <linearGradient id="flow-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="flow-right" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="text-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="grid-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#334155" fill-opacity="0.4" />
    </pattern>

    <!-- Filter Shadows -->
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="960" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="960" height="320" rx="16" fill="url(#grid-pattern)" />

  <!-- Ambient Glow Spots -->
  <rect x="0" y="0" width="360" height="320" fill="url(#glow-openai)" />
  <rect x="600" y="0" width="360" height="320" fill="url(#glow-anthropic)" />
  <rect x="300" y="0" width="360" height="320" fill="url(#glow-center)" />

  <!-- ==================== FLOW CONNECTORS ==================== -->
  <!-- Left Pipe (OpenAI -> Prime Gate) -->
  <path d="M 280 148 C 310 148, 315 148, 335 148" stroke="url(#flow-left)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.85" />
  <circle cx="308" cy="148" r="4" fill="#10b981" filter="url(#glow-badge)" />

  <!-- Right Pipe (Anthropic -> Prime Gate) -->
  <path d="M 680 148 C 650 148, 645 148, 625 148" stroke="url(#flow-right)" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.85" />
  <circle cx="652" cy="148" r="4" fill="#ea580c" filter="url(#glow-badge)" />

  <!-- ==================== LEFT NODE: OPENAI ==================== -->
  <g transform="translate(30, 35)" filter="url(#shadow-soft)">
    <!-- Card Frame -->
    <rect width="250" height="248" rx="14" fill="url(#card-grad)" stroke="url(#border-openai)" stroke-width="1.2" />

    <!-- Protocol Tag -->
    <rect x="18" y="18" width="114" height="22" rx="6" fill="#064e3b" fill-opacity="0.6" stroke="#059669" stroke-width="0.8" />
    <circle cx="28" cy="29" r="3.5" fill="#34d399" />
    <text x="38" y="33" class="font-sans" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.5">OPENAI COMPLIANT</text>

    <!-- OpenAI Icon Badge -->
    <g transform="translate(18, 52)">
      <rect width="44" height="44" rx="10" fill="#10a37f" fill-opacity="0.12" stroke="#10a37f" stroke-width="1.2" />
      <!-- OpenAI Official Spiral Vector -->
      <g transform="translate(10, 10) scale(1.0)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#10a37f">
          <path d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.872zm16.5963 3.8558L13.1038 8.364 15.1192 7.2a.0757.0757 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.407-.667zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813zm1.0976-2.3654l2.602-1.4998 2.6069 1.4998v2.9994l-2.5974 1.4997-2.6067-1.4997Z" />
        </svg>
      </g>
    </g>

    <!-- Title -->
    <text x="72" y="70" class="font-sans" font-size="16" font-weight="700" fill="#f8fafc">OpenAI API</text>
    <text x="72" y="86" class="font-sans" font-size="11" fill="#94a3b8">Standard Gateway</text>

    <!-- Divider -->
    <line x1="18" y1="108" x2="232" y2="108" stroke="#334155" stroke-width="0.8" />

    <!-- Endpoints List -->
    <g transform="translate(18, 122)">
      <!-- Item 1 -->
      <rect width="214" height="24" rx="5" fill="#0f172a" fill-opacity="0.7" />
      <text x="8" y="16" class="font-mono" font-size="10" font-weight="600" fill="#34d399">POST</text>
      <text x="42" y="16" class="font-mono" font-size="10" fill="#e2e8f0">/v1/chat/completions</text>

      <!-- Item 2 -->
      <g transform="translate(0, 28)">
        <rect width="214" height="24" rx="5" fill="#0f172a" fill-opacity="0.4" />
        <text x="8" y="16" class="font-mono" font-size="10" font-weight="600" fill="#38bdf8">POST</text>
        <text x="42" y="16" class="font-mono" font-size="10" fill="#94a3b8">/v1/embeddings</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 56)">
        <rect width="214" height="24" rx="5" fill="#0f172a" fill-opacity="0.4" />
        <text x="8" y="16" class="font-mono" font-size="10" font-weight="600" fill="#a78bfa">GET </text>
        <text x="42" y="16" class="font-mono" font-size="10" fill="#94a3b8">/v1/models</text>
      </g>
    </g>

    <!-- Client Pills -->
    <text x="18" y="232" class="font-sans" font-size="9.5" fill="#64748b">Clients: Cursor • OpenCode • Continue • Aider</text>
  </g>

  <!-- ==================== CENTER NODE: PRIME GATE GATEWAY ==================== -->
  <g transform="translate(330, 20)" filter="url(#shadow-soft)">
    <!-- Core Container Frame -->
    <rect width="300" height="278" rx="16" fill="url(#center-card-grad)" stroke="url(#border-prime)" stroke-width="1.8" />

    <!-- Center Top Badge -->
    <rect x="58" y="16" width="184" height="24" rx="12" fill="#78350f" fill-opacity="0.65" stroke="#f59e0b" stroke-width="1.2" />
    <circle cx="70" cy="28" r="4" fill="#fbbf24" filter="url(#glow-badge)" />
    <text x="82" y="32" class="font-sans" font-size="10.5" font-weight="800" fill="#fde68a" letter-spacing="0.8">UNIVERSAL BRIDGE CORE</text>

    <!-- Gateway Center Logo & Title -->
    <g transform="translate(20, 50)">
      <!-- Lightning Bolt / Core Hexagon Icon -->
      <g transform="translate(8, 0)">
        <rect width="48" height="48" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.4" />
        <!-- Glowing Lightning Bolt SVG -->
        <path d="M 27 9 L 14 26 L 24 26 L 21 39 L 34 22 L 24 22 Z" fill="url(#text-gold)" filter="url(#glow-badge)" />
      </g>

      <!-- Title & Protocol Specs -->
      <text x="68" y="24" class="font-sans" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="-0.3">PRIME GATE</text>
      <text x="68" y="42" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">Dual-Protocol Proxy Gateway</text>
    </g>

    <!-- Middle Specs Pill Matrix -->
    <g transform="translate(18, 114)">
      <!-- Row 1 -->
      <rect width="264" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.7" />
      <text x="10" y="16" class="font-sans" font-size="10" font-weight="600" fill="#fbbf24">⚡ SSE 7-Event State Machine</text>
      <text x="180" y="16" class="font-sans" font-size="9.5" fill="#94a3b8">Native Stream</text>

      <!-- Row 2 -->
      <g transform="translate(0, 28)">
        <rect width="264" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.7" />
        <text x="10" y="16" class="font-sans" font-size="10" font-weight="600" fill="#38bdf8">🛡️ Smart Cache &amp; Loop Guard</text>
        <text x="195" y="16" class="font-sans" font-size="9.5" fill="#94a3b8">Zero-Waste</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 56)">
        <rect width="264" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.7" />
        <text x="10" y="16" class="font-sans" font-size="10" font-weight="600" fill="#34d399">🔄 Dynamic Auto-Failover</text>
        <text x="182" y="16" class="font-sans" font-size="9.5" fill="#94a3b8">Multi-Account</text>
      </g>
    </g>

    <!-- Upstream Engine Sub-Card -->
    <g transform="translate(18, 206)">
      <rect width="264" height="54" rx="8" fill="#020617" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
      <text x="12" y="20" class="font-sans" font-size="9" font-weight="700" fill="#818cf8" letter-spacing="0.5">TARGET: GOOGLE ANTIGRAVITY ENGINES</text>
      
      <!-- Model Badges -->
      <g transform="translate(10, 28)">
        <!-- Claude Sonnet 4.6 Badge -->
        <rect width="118" height="18" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.6" />
        <circle cx="18" cy="9" r="3" fill="#a5b4fc" />
        <text x="26" y="12.5" class="font-sans" font-size="8.5" font-weight="600" fill="#c7d2fe">Claude 4.6 (Thinking)</text>

        <!-- Gemini 3.8 Flash Badge -->
        <g transform="translate(124, 0)">
          <rect width="118" height="18" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.6" />
          <circle cx="18" cy="9" r="3" fill="#38bdf8" />
          <text x="26" y="12.5" class="font-sans" font-size="8.5" font-weight="600" fill="#bae6fd">Gemini 3.8 Flash</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT NODE: ANTHROPIC ==================== -->
  <g transform="translate(680, 35)" filter="url(#shadow-soft)">
    <!-- Card Frame -->
    <rect width="250" height="248" rx="14" fill="url(#card-grad)" stroke="url(#border-anthropic)" stroke-width="1.2" />

    <!-- Protocol Tag -->
    <rect x="18" y="18" width="132" height="22" rx="6" fill="#7c2d12" fill-opacity="0.6" stroke="#ea580c" stroke-width="0.8" />
    <circle cx="28" cy="29" r="3.5" fill="#fb923c" />
    <text x="38" y="33" class="font-sans" font-size="10" font-weight="700" fill="#fb923c" letter-spacing="0.5">ANTHROPIC COMPLIANT</text>

    <!-- Anthropic Icon Badge -->
    <g transform="translate(18, 52)">
      <rect width="44" height="44" rx="10" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="1.2" />
      <!-- Anthropic Starburst / Claude Icon Vector -->
      <g transform="translate(10, 10)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#f97316">
          <path d="M13.827 3.52h3.603L24 20h-3.603l-6.57-16.48zm-7.258 0h3.767L16.906 20h-3.674l-1.343-3.461H5.017l-1.344 3.46H0L6.57 3.522zm4.132 9.959L8.453 7.687 6.205 13.48H10.7z" />
        </svg>
      </g>
    </g>

    <!-- Title -->
    <text x="72" y="70" class="font-sans" font-size="16" font-weight="700" fill="#f8fafc">Anthropic API</text>
    <text x="72" y="86" class="font-sans" font-size="11" fill="#94a3b8">Native Messages API</text>

    <!-- Divider -->
    <line x1="18" y1="108" x2="232" y2="108" stroke="#334155" stroke-width="0.8" />

    <!-- Endpoints List -->
    <g transform="translate(18, 122)">
      <!-- Item 1 -->
      <rect width="214" height="24" rx="5" fill="#0f172a" fill-opacity="0.7" />
      <text x="8" y="16" class="font-mono" font-size="10" font-weight="600" fill="#fb923c">POST</text>
      <text x="42" y="16" class="font-mono" font-size="10" fill="#e2e8f0">/v1/messages</text>

      <!-- Item 2 -->
      <g transform="translate(0, 28)">
        <rect width="214" height="24" rx="5" fill="#0f172a" fill-opacity="0.4" />
        <text x="8" y="16" class="font-mono" font-size="10" font-weight="600" fill="#38bdf8">POST</text>
        <text x="42" y="16" class="font-mono" font-size="10" fill="#94a3b8">/v1/messages/count_tokens</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 56)">
        <rect width="214" height="24" rx="5" fill="#0f172a" fill-opacity="0.4" />
        <text x="8" y="16" class="font-mono" font-size="10" font-weight="600" fill="#a78bfa">GET </text>
        <text x="42" y="16" class="font-mono" font-size="10" fill="#94a3b8">/v1/models</text>
      </g>
    </g>

    <!-- Client Pills -->
    <text x="18" y="232" class="font-sans" font-size="9.5" fill="#64748b">Clients: Claude Code • Cline • Roo Code • LibreChat</text>
  </g>
</svg>
