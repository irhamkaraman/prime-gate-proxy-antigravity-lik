[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-gate-proxy-antigravity-lik"
version = "1.2.8"
description = "Production-grade, OpenAI & Anthropic compatible proxy gateway for Google Antigravity with rich CLI and Glassmorphic Web UI dashboard"
readme = "README.md"
authors = [{ name = "irhamkaraman", email = "irhamkaraman@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastembed>=0.4.0",
    "onnxruntime>=1.18.0",
    "cryptography>=42.0.0",
    "keyring>=24.0.0",
]

[project.scripts]
prime-gate = "prime_gate.cli:app"

[tool.setuptools.packages.find]
include = ["prime_gate*"]
exclude = ["ui*", "data*", "locales*", "scratch*", "tests*", "docs*", "benchmarks*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

